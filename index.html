<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-container {
      width: 100%;
      max-width: 1200px;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      background: #000;
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Clickable overlay to control play/pause */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      transition: background 0.3s ease;
    }

    .video-overlay:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    .overlay-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .video-overlay:hover .overlay-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .overlay-icon svg {
      width: 32px;
      height: 32px;
      fill: #1e293b;
    }

    /* Controls section with proper background */
    .controls {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .time {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 500;
      min-width: 45px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Progress bar with visible background */
    .progress-wrapper {
      flex: 1;
      position: relative;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .progress-wrapper:hover .progress-bar::after {
      opacity: 1;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .buttons-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      width: 44px;
      height: 44px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: white;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    button svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .volume-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Volume slider with visible background */
    .volume-slider {
      width: 80px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .volume-level {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .volume-slider:hover .volume-level::after {
      opacity: 1;
    }

    .volume-level::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .spacer {
      flex: 1;
    }

    select {
      height: 44px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    select:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    select option {
      background: #1e293b;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .player-container {
        border-radius: 16px;
      }

      .controls {
        padding: 16px;
      }

      button {
        width: 40px;
        height: 40px;
      }

      .volume-slider {
        width: 60px;
      }

      select {
        height: 40px;
        padding: 0 12px;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .volume-wrapper {
        display: none;
      }

      button {
        width: 36px;
        height: 36px;
      }

      button svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="video-wrapper">
      <div id="player"></div>
      
      <!-- Overlay for play/pause control -->
      <div class="video-overlay" id="overlay">
        <div class="overlay-icon" id="overlayIcon">
          <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="progress-container">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-wrapper" id="progressWrapper">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="buttons-container">
        <button id="playPauseBtn" title="Play/Pause">
          <svg id="playBtnIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseBtnIcon" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </button>

        <button id="muteBtn" title="Mute/Unmute">
          <svg id="volumeIcon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <svg id="mutedIcon" viewBox="0 0 24 24" style="display: none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>

        <div class="volume-wrapper">
          <div class="volume-slider" id="volumeWrapper">
            <div class="volume-level" id="volumeLevel"></div>
          </div>
        </div>

        <div class="spacer"></div>

        <select id="speedSelect" title="Playback Speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>

        <button id="fullscreenBtn" title="Fullscreen">
          <svg viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let player;
    let isPlaying = false;
    let isMuted = false;
    let volume = 100;

    // Parse URL parameters for video ID
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');
    let videoId = 'dQw4w9WgXcQ'; // Default video

    if (dataParam) {
      try {
        const data = JSON.parse(dataParam);
        videoId = data.videoId_s || videoId;
      } catch (e) {
        console.error('Error parsing data parameter:', e);
      }
    }

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Initialize player when API is ready
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          controls: 0,
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      updateProgress();
      setInterval(updateProgress, 500);
    }

    function onPlayerStateChange(event) {
      isPlaying = event.data === YT.PlayerState.PLAYING;
      updatePlayPauseUI();
    }

    // Update play/pause UI
    function updatePlayPauseUI() {
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const playBtnIcon = document.getElementById('playBtnIcon');
      const pauseBtnIcon = document.getElementById('pauseBtnIcon');

      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        playBtnIcon.style.display = 'none';
        pauseBtnIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        playBtnIcon.style.display = 'block';
        pauseBtnIcon.style.display = 'none';
      }
    }

    // Toggle play/pause
    function togglePlayPause() {
      if (!player || !player.playVideo) return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // Toggle mute
    function toggleMute() {
      if (!player) return;
      
      if (isMuted) {
        player.unMute();
        isMuted = false;
      } else {
        player.mute();
        isMuted = true;
      }
      updateMuteUI();
    }

    function updateMuteUI() {
      const volumeIcon = document.getElementById('volumeIcon');
      const mutedIcon = document.getElementById('mutedIcon');

      if (isMuted) {
        volumeIcon.style.display = 'none';
        mutedIcon.style.display = 'block';
      } else {
        volumeIcon.style.display = 'block';
        mutedIcon.style.display = 'none';
      }
    }

    // Update progress bar
    function updateProgress() {
      if (!player || !player.getCurrentTime) return;

      const currentTime = player.getCurrentTime();
      const duration = player.getDuration();

      if (duration) {
        const progress = (currentTime / duration) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('currentTime').textContent = formatTime(currentTime);
        document.getElementById('duration').textContent = formatTime(duration);
      }
    }

    // Seek video
    function seekVideo(e) {
      if (!player) return;

      const progressWrapper = document.getElementById('progressWrapper');
      const rect = progressWrapper.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      const duration = player.getDuration();
      
      player.seekTo(pos * duration, true);
    }

    // Set volume
    function setVolume(e) {
      if (!player) return;

      const volumeWrapper = document.getElementById('volumeWrapper');
      const rect = volumeWrapper.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      
      volume = pos * 100;
      player.setVolume(volume);
      document.getElementById('volumeLevel').style.width = (pos * 100) + '%';
      
      if (volume === 0) {
        isMuted = true;
      } else if (isMuted) {
        isMuted = false;
      }
      updateMuteUI();
    }

    // Set playback speed
    function setPlaybackSpeed(speed) {
      if (player) {
        player.setPlaybackRate(parseFloat(speed));
      }
    }

    // Fullscreen
    function toggleFullscreen() {
      const container = document.querySelector('.player-container');
      
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Format time
    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return minutes + ':' + (secs < 10 ? '0' : '') + secs;
    }

    // Event listeners
    document.getElementById('overlay').addEventListener('click', togglePlayPause);
    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
    document.getElementById('muteBtn').addEventListener('click', toggleMute);
    document.getElementById('progressWrapper').addEventListener('click', seekVideo);
    document.getElementById('volumeWrapper').addEventListener('click', setVolume);
    document.getElementById('speedSelect').addEventListener('change', (e) => setPlaybackSpeed(e.target.value));
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
  </script>
</body>
</html>
