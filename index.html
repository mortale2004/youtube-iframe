<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .plyr__video-embed iframe {
      pointer-events: none;
    }

    .play-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .plyr {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="player-wrapper">
    <div class="plyr__video-embed" id="player"></div>
    <div class="play-overlay" id="playBtn"></div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // Helper function to get query parameters
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Get dynamic video ID (from query string or fallback)
      const youtubeId = getQueryParam('videoId') || 'qorM-Hu7Mms'; // fallback ID
      const start = getQueryParam('start') || 0;
      const end = getQueryParam('end') || null;

      // Construct iframe URL dynamically
      let iframeUrl = `https://www.youtube.com/embed/${youtubeId}?origin=${location.origin}&rel=0&showinfo=0&iv_load_policy=3&modestbranding=1&enablejsapi=1&start=${start}`;
      if (end) iframeUrl += `&end=${end}`;

      // Create iframe element dynamically
      const iframe = document.createElement('iframe');
      iframe.setAttribute('src', iframeUrl);
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
      iframe.setAttribute('allowtransparency', 'true');

      // Append iframe to player wrapper
      const playerWrapper = document.getElementById('player');
      playerWrapper.appendChild(iframe);

      // Initialize Plyr
      const player = new Plyr('#player', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
        autoplay: false,
        youtube: {
          noCookie: false,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          modestbranding: 0
        }
      });

      const playBtn = document.getElementById('playBtn');

      player.on('playing', () => {
        playBtn.classList.add('hidden');
      });

      player.on('pause', () => {
        // Optional: show overlay again on pause
        // playBtn.classList.remove('hidden');
      });

      player.on('ended', () => {
        playBtn.classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
